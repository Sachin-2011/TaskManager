
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>TaskManager — Signup</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body class="bg">
  <div class="card auth-card">
    <h1 class="app-title">TaskManager</h1>
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: #94a3b8; font-weight: 500; font-size: 1.3rem;">Sign-Up</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash">
          {% for category, msg in messages %}
            <div class="flash-item {{ category }}">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form method="POST" class="form">
      <label>Username</label>
      <input name="username" type="text" required placeholder="username"/>
      <label>Password</label>
      <input name="password" type="password" required placeholder="password"/>
      <button class="btn primary w-full" type="submit">Create account</button>
    </form>
    <div class="muted">Already member? <a href="{{ url_for('login') }}">Log in</a></div>
  </div>
</body>
</html>
